<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VendorScreen — Screening Audit</title>
    <script src="https://cdn.jsdelivr.net/npm/monday-sdk-js/dist/main.js"></script>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #323338;
        --muted: #676879;
        --border: #d0d4e4;
        --accent: #0073ea;
        --row: #f6f7fb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1f3b;
          --fg: #d5d8df;
          --muted: #9699a6;
          --border: #33355b;
          --accent: #5a9bff;
          --row: #23264a;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 16px;
        font-family: "Figtree", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: var(--fg);
        background: var(--bg);
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
        flex-wrap: wrap;
      }
      h1 {
        font-size: 16px;
        margin: 0;
      }
      #count {
        color: var(--muted);
        font-size: 13px;
      }
      button {
        background: var(--accent);
        color: #fff;
        border: 0;
        border-radius: 6px;
        padding: 8px 14px;
        font-size: 14px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .actions {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .toggle-wrap {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: var(--muted);
        cursor: pointer;
        user-select: none;
      }
      .toggle {
        position: relative;
        display: inline-block;
        flex: 0 0 auto;
        width: 36px;
        height: 20px;
      }
      .toggle input {
        position: absolute;
        opacity: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        cursor: pointer;
      }
      .toggle .slider {
        position: absolute;
        inset: 0;
        background: var(--border);
        border-radius: 999px;
        transition: background 0.15s ease;
      }
      .toggle .slider::before {
        content: "";
        position: absolute;
        left: 2px;
        top: 2px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        transition: transform 0.15s ease;
      }
      .toggle input:checked + .slider {
        background: var(--accent);
      }
      .toggle input:checked + .slider::before {
        transform: translateX(16px);
      }
      .toggle input:focus-visible + .slider {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .table-wrap {
        overflow-x: auto;
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
        white-space: nowrap;
      }
      th,
      td {
        text-align: left;
        padding: 8px 12px;
        border-bottom: 1px solid var(--border);
      }
      th {
        color: var(--muted);
        font-weight: 600;
      }
      tbody tr:nth-child(even) {
        background: var(--row);
      }
      .msg {
        color: var(--muted);
        padding: 24px 0;
        font-size: 14px;
      }
      a {
        color: var(--accent);
      }
      .risk {
        font-weight: 600;
      }
      .risk-Critical {
        color: #d83a52;
      }
      .risk-Warning {
        color: #d9a300;
      }
      .risk-Clear {
        color: #258750;
      }
      /* --- Free-plan teaser --------------------------------------------- */
      .teaser {
        position: relative;
      }
      /* Keep the newest row sharp as a taste of the value; blur the rest so the
         upgrade prompt has something concrete to sit over. */
      .teaser tbody tr:not(:first-child) {
        filter: blur(4px);
        pointer-events: none;
        user-select: none;
      }
      .upgrade {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        pointer-events: none;
      }
      /* A solid card so the CTA stays readable, while the blurred rows behind it
         remain visible (they hint at how much history is locked). */
      .upgrade-card {
        pointer-events: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        text-align: center;
        max-width: 380px;
        padding: 16px 22px;
        border-radius: 10px;
        background: var(--bg);
        border: 1px solid var(--border);
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.28);
      }
      .upgrade-card .headline {
        font-size: 15px;
        font-weight: 600;
      }
      .upgrade-card .sub {
        font-size: 13px;
        color: var(--muted);
      }
      .badge {
        display: inline-block;
        margin-left: 6px;
        padding: 1px 7px;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font-size: 11px;
        font-weight: 600;
        vertical-align: middle;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Screening Audit</h1>
        <span id="count"></span>
      </div>
      <div class="actions">
        <label class="toggle-wrap">
          <span>Include Sidekick chat screenings</span>
          <span class="toggle">
            <input type="checkbox" id="includeAi" />
            <span class="slider"></span>
          </span>
        </label>
        <button id="download" disabled>Download CSV</button>
      </div>
    </header>
    <div id="content"><div class="msg">Loading…</div></div>

    <script>
      const monday = window.mondaySdk();
      const content = document.getElementById("content");
      const countEl = document.getElementById("count");
      const downloadBtn = document.getElementById("download");

      let boardId = null;
      let sessionToken = null;
      const includeAiCheckbox = document.getElementById("includeAi");

      function esc(v) {
        return v == null ? "" : String(v).replace(/[&<>"]/g, (c) =>
          ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])
        );
      }

      // Display the 0–1 match score as a whole percentage (e.g. 0.836 -> "84%").
      // Empty for Clear / no-match rows where there is no score. Export CSV keeps
      // the raw number for spreadsheet analysis.
      function fmtScore(score) {
        if (score == null || score === "") return "";
        const n = Number(score);
        return Number.isFinite(n) ? Math.round(n * 100) + "%" : "";
      }

      // Build just the <table> markup for a set of rows (no empty-state / no
      // teaser chrome — the caller decides how to frame it).
      function tableMarkup(rows) {
        const head =
          "<tr><th>Date</th><th>Source</th><th>Vendor</th><th>Country</th><th>Risk</th>" +
          "<th>Type</th><th>Score</th><th>Match</th></tr>";
        const body = rows
          .map((r) => {
            const date = (r.created_at || "").replace("T", " ").slice(0, 19);
            const risk = esc(r.risk_level);
            // Sidekick chat screenings carry no board_id — they aren't tied to
            // this board, so label them distinctly rather than implying they
            // came from an item on this board.
            const source = r.board_id == null ? "Sidekick chat" : "This board";
            let match = esc(r.match_caption);
            if (r.match_id && r.match_caption) {
              const url =
                "https://www.opensanctions.org/entities/" + encodeURIComponent(r.match_id) + "/";
              match =
                '<a href="' + esc(url) + '" target="_blank" rel="noopener">' + match + "</a>";
            }
            return (
              "<tr><td>" +
              esc(date) +
              "</td><td>" +
              esc(source) +
              "</td><td>" +
              esc(r.vendor_name) +
              "</td><td>" +
              esc(r.country) +
              '</td><td class="risk risk-' +
              risk +
              '">' +
              risk +
              "</td><td>" +
              esc(r.match_type) +
              "</td><td>" +
              esc(fmtScore(r.score)) +
              "</td><td>" +
              match +
              "</td></tr>"
            );
          })
          .join("");
        return (
          '<div class="table-wrap"><table><thead>' +
          head +
          "</thead><tbody>" +
          body +
          "</tbody></table></div>"
        );
      }

      function render(data) {
        const rows = data.rows || [];
        const locked = !!data.locked;

        // Export lives on paid plans only — reflect that in the button and (when
        // locked) the CTA below. See MONETIZATION.md.
        downloadBtn.disabled = locked;
        downloadBtn.innerHTML = locked
          ? 'Download CSV <span class="badge">Pro</span>'
          : "Download CSV";
        downloadBtn.title = locked ? "Upgrade to Pro or Business to export the audit" : "";

        if (!rows.length) {
          content.innerHTML =
            '<div class="msg">No screenings recorded for this board yet.</div>';
          countEl.textContent = "";
          return;
        }

        if (!locked) {
          countEl.textContent = rows.length + " screening" + (rows.length === 1 ? "" : "s");
          content.innerHTML = tableMarkup(rows);
          return;
        }

        // Free plan: blur the preview and overlay an upgrade prompt. `total` is
        // the real number of screenings behind the wall.
        const total = data.total || rows.length;
        const hidden = Math.max(total - rows.length, 0);
        countEl.textContent = total + " screening" + (total === 1 ? "" : "s");
        const sub = hidden
          ? hidden + " more " + (hidden === 1 ? "screening is" : "screenings are") +
            " hidden on the Free plan. Upgrade to see your full audit history and export it."
          : "Upgrade to Pro or Business to export your audit history to CSV.";
        content.innerHTML =
          '<div class="teaser">' +
          tableMarkup(rows) +
          '<div class="upgrade"><div class="upgrade-card">' +
          '<div class="headline">Unlock your full screening audit</div>' +
          '<div class="sub">' +
          esc(sub) +
          "</div></div></div></div>";
      }

      async function loadAudit() {
        try {
          const includeAi = includeAiCheckbox.checked ? "1" : "0";
          const resp = await fetch(
            "/view/audit.json?boardId=" + encodeURIComponent(boardId) + "&includeAi=" + includeAi,
            { headers: { Authorization: "Bearer " + sessionToken } }
          );
          if (!resp.ok) throw new Error("HTTP " + resp.status);
          const data = await resp.json();
          render(data);
        } catch (err) {
          content.innerHTML =
            '<div class="msg">Could not load the audit (' + esc(err.message) + ").</div>";
        }
      }

      async function downloadCsv() {
        downloadBtn.disabled = true;
        try {
          const includeAi = includeAiCheckbox.checked ? "1" : "0";
          const resp = await fetch(
            "/view/audit.csv?boardId=" + encodeURIComponent(boardId) + "&includeAi=" + includeAi,
            { headers: { Authorization: "Bearer " + sessionToken } }
          );
          if (!resp.ok) throw new Error("HTTP " + resp.status);
          const blob = await resp.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = "vendorscreen-audit-board-" + boardId + ".csv";
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
        } catch (err) {
          content.innerHTML =
            '<div class="msg">Download failed (' + esc(err.message) + ").</div>";
        } finally {
          downloadBtn.disabled = false;
        }
      }

      downloadBtn.addEventListener("click", downloadCsv);
      includeAiCheckbox.addEventListener("change", loadAudit);

      async function init() {
        try {
          const [ctx, tokenRes] = await Promise.all([
            monday.get("context"),
            monday.get("sessionToken"),
          ]);
          boardId = ctx.data && ctx.data.boardId;
          sessionToken = tokenRes.data;
          if (!boardId || !sessionToken) throw new Error("missing board context");
          await loadAudit();
        } catch (err) {
          content.innerHTML =
            '<div class="msg">Could not initialize (' + esc(err.message) + ").</div>";
        }
      }

      init();
    </script>
  </body>
</html>
