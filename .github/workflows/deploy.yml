name: Deploy to monday code

# Runs the full test -> deploy -> smoke chain on both PRs and merges to main, so
# a change is verified end-to-end against a real (draft) deploy BEFORE it lands.
# `test` runs for every event (it's the required check); `deploy`/`smoke` are
# gated to same-repo, non-draft PRs and pushes (see the deploy job's `if`).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Two-tier concurrency:
# 1) Workflow-level, keyed per PR (or per branch): a new push to the SAME ref
#    cancels its own superseded run, so a stale commit's build/deploy doesn't sit
#    in the queue or waste a draft-deploy slot. Only ever cancels the same ref.
# 2) The `deploy` job additionally joins a GLOBAL group (see its own concurrency
#    block) so deploys across DIFFERENT PRs/main never overlap on monday's single
#    shared draft version.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Detect whether this change touches anything that actually affects the app,
  # its tests, the build, or CI. Doc-only changes (**/*.md, LICENSE, etc.) leave
  # `app=false`, which gates the expensive deploy/smoke below — so a README edit
  # never burns the single shared draft-deploy slot. We gate at the JOB level (not
  # with a workflow-level `paths:` filter) on purpose: `test`/`deploy`/`smoke` are
  # all required status checks, and a workflow skipped by a paths filter never
  # reports them (blocking the PR forever), whereas a job skipped by `if:` reports
  # "skipped" — which branch protection treats as passed. `test` always runs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'src/**'
              - 'tests/**'
              - 'scripts/**'
              - 'requirements-dev.txt'
              - 'pyproject.toml'
              - '.github/workflows/**'

  test:
    runs-on: ubuntu-latest
    # Throwaway Postgres so the quota integration test runs against a real DB.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vendorscreen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Tests (pytest)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vendorscreen_test
        run: pytest -q

  deploy:
    needs: [test, changes]
    # Deploy only when app/CI files actually changed (skips doc-only changes so
    # the shared draft slot isn't burned on a README edit — this skip reports as
    # a passed required check), AND on pushes or on PRs that can access secrets
    # (same-repo, not a fork) and aren't a draft/WIP. Fork or draft PRs still run
    # `test`; doc-only or fork/draft PRs simply skip `deploy`/`smoke`.
    if: >-
      needs.changes.outputs.app == 'true' &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.draft == false))
    runs-on: ubuntu-latest
    # GLOBAL serialization onto monday's single shared draft version: every
    # deploy (any PR or main) must run one-at-a-time here. cancel-in-progress:
    # false lets an in-flight deploy of a DIFFERENT ref finish rather than being
    # clobbered midway — same-ref supersession is already handled by the
    # workflow-level group above.
    concurrency:
      group: deploy-monday
      cancel-in-progress: false
    outputs:
      app_url: ${{ steps.deploy.outputs.app_url }}
    env:
      APP_ID: ${{ vars.MONDAY_APP_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install monday apps CLI
        run: npm install -g @mondaycom/apps-cli

      # The CLI reads its token from a local .mappsrc file (no env-var support),
      # so we generate one from the MONDAY_TOKEN secret before any command.
      - name: Authenticate monday CLI
        run: mapps init -t "$MONDAY_TOKEN" -l
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}

      # monday deploys code into the app's latest DRAFT version. After a version
      # is promoted to live, no draft remains and there is nothing to deploy
      # into. Detect that up front and fail with an actionable message instead
      # of the CLI's opaque error. (The CLI has no --json output, so we match
      # the human-readable list; the deploy step below is the reliable backstop.)
      - name: Check that a draft version exists
        run: |
          set +e
          VERSIONS=$(mapps app-version:list -i "$APP_ID" 2>&1)
          STATUS=$?
          echo "$VERSIONS"
          if [ $STATUS -eq 0 ] && ! echo "$VERSIONS" | grep -qi "draft"; then
            echo "::error title=No draft version::This app has no draft version to deploy into."
            echo "monday code always deploys into the latest DRAFT version. Once a version is promoted to live, no draft is left, so the deploy has nowhere to go."
            echo "Fix: open the monday Developer Center -> your app -> Versions -> 'Create new version' (it starts as a draft), then re-run this workflow."
            exit 1
          fi

      - name: Deploy to the latest draft version
        id: deploy
        run: |
          set +e
          # -d src: only the app code in src/ is deployed (Procfile and
          # requirements.txt live there too). No -z/region flag: this app
          # rejects it ("Region parameter is not allowed for this app") — the
          # CLI resolves the region itself.
          OUTPUT=$(mapps code:push -a "$APP_ID" -d src 2>&1)
          STATUS=$?
          echo "$OUTPUT"
          if [ $STATUS -ne 0 ]; then
            echo "::error title=Deploy failed::Pushing code to monday failed."
            if echo "$OUTPUT" | grep -qi "draft"; then
              echo "Likely cause: no draft version exists. Create a new version in the monday Developer Center (it starts as a draft), then re-run."
            else
              echo "Check that MONDAY_TOKEN is valid and not expired and MONDAY_APP_ID ($APP_ID) is correct."
            fi
            exit 1
          fi
          echo "Deployed successfully to the latest draft version."
          # code:push prints the deployment URL on success. Extract it so the
          # smoke job can hit the running draft. If the log format ever changes
          # and this misses, set STAGING_APP_URL to point at the draft manually.
          URL=$(printf '%s' "$OUTPUT" | grep -oE 'https://[a-zA-Z0-9._-]+\.monday\.app[^[:space:]]*' | head -1)
          URL=${URL:-${{ vars.STAGING_APP_URL }}}
          if [ -z "$URL" ]; then
            echo "::warning::Could not determine the deployed URL from the deploy log; smoke test will be skipped. Set a STAGING_APP_URL repo variable to enable it."
          else
            echo "Deployed draft is at: $URL"
          fi
          echo "app_url=$URL" >> "$GITHUB_OUTPUT"

  # Runs against the ALREADY-DEPLOYED draft, before you promote it to live.
  smoke:
    needs: deploy
    if: needs.deploy.outputs.app_url != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install smoke-test deps
        run: pip install httpx PyJWT

      # Cheap check: the service booted, secrets loaded, /health answers.
      - name: Health check
        run: |
          curl -fsS "${{ needs.deploy.outputs.app_url }}/health" | grep -q '"status":"ok"'
          echo "Health OK"

      # Full flow: create item -> call action endpoint -> assert the board was
      # updated. Only runs if a test board is configured (E2E_BOARD_ID set).
      - name: End-to-end (create item, screen, verify)
        if: vars.E2E_BOARD_ID != ''
        env:
          APP_URL: ${{ needs.deploy.outputs.app_url }}
          MONDAY_SIGNING_SECRET: ${{ secrets.MONDAY_SIGNING_SECRET }}
          # Enables the board-view data-endpoint checks (mints a session token).
          # If unset, the board-view stage checks only the /view HTML.
          MONDAY_CLIENT_SECRET: ${{ secrets.MONDAY_CLIENT_SECRET }}
          E2E_MONDAY_TOKEN: ${{ secrets.E2E_MONDAY_TOKEN }}
          E2E_BOARD_ID: ${{ vars.E2E_BOARD_ID }}
          E2E_STATUS_COLUMN: ${{ vars.E2E_STATUS_COLUMN }}
          E2E_DETAILS_COLUMN: ${{ vars.E2E_DETAILS_COLUMN }}
          E2E_VENDOR_NAME: ${{ vars.E2E_VENDOR_NAME }}
          # Optional country column — exercises the /match country refinement.
          E2E_COUNTRY_COLUMN: ${{ vars.E2E_COUNTRY_COLUMN }}
          # E2E_SKIP_EXPORT=1 skips the whole export section (audit CSV +
          # notification) — e.g. until DATABASE_URL is set on the deploy.
          E2E_SKIP_EXPORT: ${{ vars.E2E_SKIP_EXPORT }}
          # The notification stage is opt-in and live-only (a personal token
          # notifying itself may be rejected in CI, and it doesn't exercise the
          # real notifications:write scope). Default off; set E2E_RUN_NOTIFY=1
          # only if you knowingly want CI to attempt it.
          E2E_RUN_NOTIFY: ${{ vars.E2E_RUN_NOTIFY }}
        run: python scripts/e2e_smoke.py
